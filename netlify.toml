[build]
command = "rm -rf node_modules package-lock.json && npm install && npm run build"
publish = "dist"

[[headers]]
for = "/demo.mp4"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/install.sh"
to = "/install.sh"
status = 200

[[redirects]]
from = "/install.ps1"
to = "/install.ps1"
status = 200

[[redirects]]
from = "/releases/*"
to = "/releases/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
